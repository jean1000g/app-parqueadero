{% extends 'base.html' %}
{% block titulo %}Registro{% endblock %}
{% block cuerpo %}
<section class="tarjeta angosta">
  <h1>Crear cuenta</h1>
  <form method="post" class="formulario">
    {% set datos = request.form %}
    {% include '_campos_usuario.html' %}
    <label>Contraseña (mínimo 6 caracteres) <input type="password" name="contrasena" required></label>
    <button class="boton">Registrarme</button>
  </form>
  <p><a href="{{ url_for('login') }}">Volver al inicio de sesión</a></p>
</section>
{% endblock %}
