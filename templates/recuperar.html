{% extends 'base.html' %}
{% block titulo %}Restablecer contraseña{% endblock %}
{% block cuerpo %}
<section class="tarjeta angosta">
  <h1>Restablecer contraseña</h1>
  <p>Confirma tu correo y tu documento para crear una nueva contraseña.</p>
  <form method="post" class="formulario">
    <label>Correo <input type="email" name="correo" required></label>
    <label>Documento <input name="documento" required></label>
    <label>Nueva contraseña <input type="password" name="contrasena" required></label>
    <button class="boton">Restablecer</button>
  </form>
  <p><a href="{{ url_for('login') }}">Volver</a></p>
</section>
{% endblock %}
